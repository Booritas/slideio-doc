# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  # conf.py runs Doxygen on the SlideIO headers for the C++ API reference.
  apt_packages:
    - doxygen

# The SlideIO library sources, for the C++ API reference and the version.
# Its own submodules are build dependencies the documentation does not need.
submodules:
  include:
    - extern/slideio
  recursive: false

python:
  install:
    - requirements: docs/requirements.txt

sphinx:
  configuration: docs/source/conf.py
  fail_on_warning: false
